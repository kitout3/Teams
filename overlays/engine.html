<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Cyrus · Habillage</title><style>html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}canvas{display:block;width:1920px;height:1080px}</style></head><body><canvas id="graphics" width="1920" height="1080"></canvas><script src="../assets/layout.js"></script><script>const L=CyrusLayout,ctx=document.getElementById('graphics').getContext('2d'),images={};let state=L.defaults();state.logo.visible=false;state.lower.visible=false;try{const v=JSON.parse(localStorage.getItem('cyrus-engine-live'));if(v)state=L.normalize(v)}catch{}function render(){L.draw(ctx,state,images)}function custom(){if(state.logo.customSrc){const i=new Image();i.onload=render;i.src=state.logo.customSrc;images.custom=i}else delete images.custom}function remember(){try{localStorage.setItem('cyrus-engine-live',JSON.stringify(state))}catch{}custom();render()}for(const [k,f] of Object.entries(L.logos)){const i=new Image();i.onload=render;i.src='../assets/'+f;images[k]=i}custom();window.addEventListener('officeLiveControl',e=>{const m=e.detail||{};if(m.type==='layout'){state=L.normalize(m.layout);remember()}else if(m.type==='lower'){for(const k of ['name','role','company'])if(typeof m[k]==='string')state.lower[k]=m[k].slice(0,160);state.lower.visible=!!m.show;remember()}else if(m.type==='logo'){state.logo.visible=!!m.show;remember()}});if(document.fonts)document.fonts.ready.then(render);render();</script></body></html>
