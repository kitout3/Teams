name: Fix lower third and logo controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch regie
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="row"><button class="primary ctl" onclick="run(()=>lower(true))">Afficher</button><button class="ctl" onclick="run(()=>lower(false))">Masquer</button></div></section>\n<section class="card"><h2>Audio</h2>'''
          new='''<div class="row"><button class="primary ctl" onclick="run(()=>lower(true))">Afficher</button><button class="ctl" onclick="run(()=>lower(false))">Masquer</button></div></section>\n<section class="card"><h2>Logo</h2><p>Affichez ou masquez le logo configuré dans « Modifier l’habillage ».</p><div class="row"><button class="primary ctl" onclick="run(()=>logo(true))">Afficher le logo</button><button class="ctl" onclick="run(()=>logo(false))">Masquer le logo</button></div></section>\n<section class="card"><h2>Audio</h2>'''
          if old not in s:
              raise SystemExit('Zone UI introuvable')
          s=s.replace(old,new,1)
          old2="async function lower(show){if(show&&!name.value.trim())throw new Error('Renseignez le nom.');await emit({type:'lower',show,name:name.value,role:role.value,company:company.value});msg(show?'Bandeau envoyé.':'Bandeau masqué.')}"
          new2="async function lower(show){const n=$('name'),r=$('role'),c=$('company');const nv=(n?.value??'').trim();if(show&&!nv)throw new Error('Renseignez le nom.');await emit({type:'lower',show,name:nv,role:r?.value??'',company:c?.value??''});msg(show?'Bandeau envoyé.':'Bandeau masqué.')}\nasync function logo(show){await emit({type:'logo',show});msg(show?'Logo affiché.':'Logo masqué.')}"
          if old2 not in s:
              raise SystemExit('Fonction lower introuvable')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Harden layout text rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/layout.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("function lines(ctx,text,width){let result=[],line='';for(const char of Array.from(text)){", "function lines(ctx,text,width){text=String(text??'');let result=[],line='';for(const char of Array.from(text)){", 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/layout.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix bandeau intervenant et ajoute commandes logo [lower-logo-fixed]"
          git push
